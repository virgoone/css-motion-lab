<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A copy-ready, dependency-free CSS folder pocket interaction."
    />
    <title>Folder Pocket — CSS Motion Lab</title>
    <link rel="stylesheet" href="./page.css" />
    <link rel="stylesheet" href="./folder.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="effect-header">
      <a class="back-link" href="../../" aria-label="Back to the effect index">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <path d="M15 9H3m5-5L3 9l5 5" />
        </svg>
        <span>Index</span>
      </a>

      <a class="effect-brand" href="../../">CSS Motion Lab</a>
    </header>

    <main class="effect-page">
      <aside class="source-panel" aria-labelledby="source-title">
        <div class="source-panel__heading">
          <div>
            <p class="source-panel__eyebrow">Source</p>
            <h1 id="source-title">Copy the effect</h1>
          </div>
          <span class="dependency-badge">0 dependencies</span>
        </div>

        <div class="source-tabs" role="tablist" aria-label="Code formats">
          <button
            class="source-tab is-active"
            id="tab-html"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="source-code"
            data-snippet="html"
          >
            HTML
          </button>
          <button
            class="source-tab"
            id="tab-css"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="source-code"
            data-snippet="css"
          >
            CSS
          </button>
          <button
            class="source-tab"
            id="tab-full"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="source-code"
            data-snippet="full"
          >
            Full page
          </button>
        </div>

        <pre class="code-window" id="source-code" role="tabpanel" aria-labelledby="tab-html"><code id="code-output">Loading source…</code></pre>

        <div class="source-panel__footer">
          <p id="copy-status" aria-live="polite">Ready to copy</p>
          <button class="copy-button" id="copy-button" type="button">
            <svg class="copy-button__copy" viewBox="0 0 20 20" aria-hidden="true">
              <rect x="7" y="7" width="9" height="9" rx="2" />
              <path d="M5 13H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" />
            </svg>
            <svg class="copy-button__check" viewBox="0 0 20 20" aria-hidden="true">
              <path d="m4 10 4 4 8-8" />
            </svg>
            <span>Copy code</span>
          </button>
        </div>
      </aside>

      <section class="preview-stage" aria-labelledby="preview-title">
        <div class="preview-stage__meta">
          <p>Live preview</p>
          <span>Hover, focus, or press</span>
        </div>

        <div class="preview-stage__canvas">
          <button
            class="folder folder--amber"
            id="live-folder"
            type="button"
            aria-label="Preview the Folder Pocket interaction"
          >
            <span class="folder__object" aria-hidden="true">
              <span class="folder__back"></span>
              <span class="folder__papers">
                <span class="paper paper--rear"></span>
                <span class="paper paper--left"></span>
                <span class="paper paper--right"></span>
              </span>
              <span class="folder__front">
                <span class="folder__label">
                  <span>Design Folder</span>
                  <small>45 files</small>
                </span>
              </span>
            </span>
          </button>
        </div>

        <div class="preview-identity">
          <span>01 / 01</span>
          <span class="preview-identity__slash">//</span>
          <h2 id="preview-title">Folder Pocket</h2>
        </div>
      </section>

      <aside class="theme-panel" aria-labelledby="theme-title">
        <div>
          <p class="theme-panel__eyebrow">Material</p>
          <h2 id="theme-title">Folder color</h2>
        </div>

        <div class="theme-options">
          <button class="theme-option is-active" type="button" data-theme="amber" aria-pressed="true">
            <span class="theme-swatch theme-swatch--amber" aria-hidden="true"></span>
            <span>Amber</span>
          </button>
          <button class="theme-option" type="button" data-theme="graphite" aria-pressed="false">
            <span class="theme-swatch theme-swatch--graphite" aria-hidden="true"></span>
            <span>Graphite</span>
          </button>
          <button class="theme-option" type="button" data-theme="pearl" aria-pressed="false">
            <span class="theme-swatch theme-swatch--pearl" aria-hidden="true"></span>
            <span>Pearl</span>
          </button>
        </div>

        <p class="theme-panel__note">The selected theme is reflected in the HTML snippet.</p>
      </aside>
    </main>
  </body>
</html>
